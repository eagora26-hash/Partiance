<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" role="img" aria-label="Partiance">
  <defs>
    <linearGradient id="partner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A434B"/><stop offset="1" stop-color="#11151B"/>
    </linearGradient>
    <linearGradient id="alliance" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FF0E6"/><stop offset="0.5" stop-color="#22E3D6"/><stop offset="1" stop-color="#12B5AB"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#050816"/>
  <!-- Partner link (back, graphite) -->
  <rect x="12" y="16" width="26" height="30" rx="9" fill="none" stroke="url(#partner)" stroke-width="7"/>
  <!-- knockout where Alliance passes in front -->
  <line x1="33" y1="20" x2="33" y2="36" stroke="#050816" stroke-width="11" stroke-linecap="round"/>
  <!-- Alliance link (front, cyan) -->
  <rect x="26" y="14" width="26" height="28" rx="9" fill="none" stroke="url(#alliance)" stroke-width="7"/>
</svg>
