# ============================================================
#  PARTIANCE — Render Blueprint (Infrastructure as Code)
#  One web service (Docker) + one managed Postgres database.
#  Migrations run automatically on every boot via docker-entrypoint.sh
#  (`prisma migrate deploy`), so the schema is applied on first deploy.
#
#  After the first deploy, set the SECRET env vars marked `sync: false`
#  in the Render dashboard (or `render env set`):
#    • RESEND_API_KEY   — required for verification & password-reset emails
#    • APP_URL          — set to the service's public URL once known
#  Everything else is provisioned automatically.
# ============================================================
databases:
  - name: partiance-db
    databaseName: partiance
    user: partiance
    plan: free
    region: frankfurt # EU region — Italy-first, GDPR-friendly

services:
  - type: web
    name: partiance
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Render sets PORT; the standalone server reads it. HOSTNAME binds 0.0.0.0.
      - key: HOSTNAME
        value: 0.0.0.0
      # Database — wired automatically from the managed Postgres above.
      - key: DATABASE_URL
        fromDatabase:
          name: partiance-db
          property: connectionString
      # Auth.js — secret auto-generated once; trust the Render proxy host.
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      # Public URL — used for verification/reset links, sitemap, canonical.
      # Set this to the service URL (e.g. https://partiance.onrender.com) after
      # the first deploy, or to the custom domain once attached.
      - key: APP_URL
        sync: false
      # Email — Resend (required in production for auth emails). Fill in the key.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Partiance <no-reply@partiance.it>
